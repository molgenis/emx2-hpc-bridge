[project]
name = "emx2-hpc-bridge"
version = "0.1.0"
description = "Bridge between EMX2 and HPC jobs"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv",
    "requests",
]

[project.scripts]
emx2-hpc-bridge = "emx2_hpc_bridge.main:main"

[project.optional-dependencies]
dev = ["pytest", "flake8", "black"]

[tool.black]
line-length = 88
target-version = ["py39"]
include = '\.pyi?$'
